openapi: 3.0.3
info:
  title: Kodify API
  description: API de controle financeiro pessoal — gastos, receitas, investimentos e dashboard.
  version: 1.0.0

servers:
  - url: https://api.kodify.com.br/api/v1
    description: Produção
  - url: http://localhost:3000/api/v1
    description: Local

security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: NOT_FOUND
            msg:
              type: string
              example: recurso não encontrado

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: João Silva
        email:
          type: string
          format: email
          example: joao@email.com
        password:
          type: string
          minLength: 8
          example: MinhaS3nh4!

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@email.com
        password:
          type: string
          example: MinhaS3nh4!

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_at:
          type: string
          format: date-time
          example: 2026-03-16T12:00:00Z

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: João Silva
        email:
          type: string
          example: joao@email.com
        role:
          type: string
          example: user
        created_at:
          type: string
          format: date-time
          example: 2026-03-01T10:00:00Z

    CreateExpenseRequest:
      type: object
      required: [amount]
      properties:
        category_slug:
          type: string
          example: alimentacao
          description: Slug da categoria. Padrão "outros" se omitido.
        amount:
          type: number
          format: float
          example: 39.90
          description: Valor em reais.
        description:
          type: string
          example: Almoço no restaurante
        occurred_at:
          type: string
          example: 2026-03-10
          description: RFC3339 ou YYYY-MM-DD. Padrão agora se omitido.

    ExpenseResponse:
      type: object
      properties:
        id:
          type: integer
          example: 42
        category_slug:
          type: string
          example: alimentacao
        category_name:
          type: string
          example: Alimentação
        amount:
          type: number
          example: 39.90
        description:
          type: string
          example: Almoço no restaurante
        occurred_at:
          type: string
          example: 2026-03-10
        created_at:
          type: string
          example: 2026-03-10T12:30:00Z

    CategoryItem:
      type: object
      properties:
        slug:
          type: string
          example: alimentacao
        name:
          type: string
          example: Alimentação

    CreateInvestmentRequest:
      type: object
      required: [type_slug, amount]
      properties:
        type_slug:
          type: string
          example: cdb
        amount:
          type: number
          format: float
          example: 500.00
          description: Valor em reais.
        description:
          type: string
          example: Tesouro Selic
        invested_at:
          type: string
          example: 2026-03-01
          description: RFC3339 ou YYYY-MM-DD. Padrão agora se omitido.

    InvestmentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 10
        type_slug:
          type: string
          example: cdb
        type_name:
          type: string
          example: CDB
        amount:
          type: number
          example: 500.00
        description:
          type: string
          example: Tesouro Selic
        invested_at:
          type: string
          example: 2026-03-01
        created_at:
          type: string
          example: 2026-03-01T09:00:00Z

    InvestmentTypeItem:
      type: object
      properties:
        slug:
          type: string
          example: cdb
        name:
          type: string
          example: CDB

    CreateRevenueRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: float
          example: 5000.00
          description: Valor em reais.
        description:
          type: string
          example: Salário de março
        received_at:
          type: string
          example: 2026-03-05
          description: RFC3339 ou YYYY-MM-DD. Padrão agora se omitido.

    RevenueResponse:
      type: object
      properties:
        id:
          type: integer
          example: 7
        amount:
          type: number
          example: 5000.00
        description:
          type: string
          example: Salário de março
        received_at:
          type: string
          example: 2026-03-05
        created_at:
          type: string
          example: 2026-03-05T08:00:00Z

    SummaryResponse:
      type: object
      properties:
        month:
          type: string
          example: 2026-03
        total_expenses:
          type: number
          example: 1250.75
        total_revenues:
          type: number
          example: 5000.00
        balance:
          type: number
          example: 3749.25
        total_investments:
          type: number
          example: 500.00
          description: Aportes do mês.
        all_time_investments:
          type: number
          example: 12000.00
          description: Total acumulado de investimentos.
        expenses_by_category:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
                example: alimentacao
              name:
                type: string
                example: Alimentação
              total:
                type: number
                example: 450.00
        investments_by_type:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
                example: cdb
              name:
                type: string
                example: CDB
              total:
                type: number
                example: 500.00

    StatementResponse:
      type: object
      properties:
        month:
          type: string
          example: 2026-03
        entries:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [expense, revenue, investment]
                example: expense
              date:
                type: string
                example: 2026-03-10
              amount:
                type: number
                example: 39.90
              label:
                type: string
                example: Alimentação
                description: Categoria (expense) ou tipo (investment). Vazio para revenue.
              description:
                type: string
                example: Almoço no restaurante

    TelegramLinkResponse:
      type: object
      properties:
        token:
          type: string
          example: a3f8c1d2e4b5...
        expires_at:
          type: string
          format: date-time
          example: 2026-03-15T12:15:00Z

paths:

  # ─── Health ────────────────────────────────────────────────────────────────

  /status:
    get:
      tags: [Health]
      summary: Status da aplicação
      responses:
        '200':
          description: App e banco operacionais
          content:
            application/json:
              example:
                app: ok
                db: ok

  # ─── Auth ──────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Criar conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              example:
                id: 1
                name: João Silva
                email: joao@email.com
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login — retorna JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Usuário ───────────────────────────────────────────────────────────────

  /me:
    get:
      tags: [Usuário]
      summary: Perfil do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /telegram/link:
    post:
      tags: [Usuário]
      summary: Gerar token para vincular conta ao bot Telegram
      description: |
        Gera um token de 15 minutos. No Telegram, envie `/start <token>` para vincular.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLinkResponse'
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Despesas ──────────────────────────────────────────────────────────────

  /expenses:
    post:
      tags: [Despesas]
      summary: Registrar gasto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Gasto registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Dados inválidos ou categoria não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Despesas]
      summary: Listar gastos
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            example: 2026-03
          description: Filtrar por mês (YYYY-MM). Sem filtro retorna todos.
        - name: category
          in: query
          schema:
            type: string
            example: alimentacao
          description: Filtrar por slug de categoria.
      responses:
        '200':
          description: Lista de gastos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expenses/categories:
    get:
      tags: [Despesas]
      summary: Listar categorias disponíveis
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryItem'
              example:
                - slug: alimentacao
                  name: Alimentação
                - slug: transporte
                  name: Transporte
                - slug: saude
                  name: Saúde
                - slug: lazer
                  name: Lazer
                - slug: moradia
                  name: Moradia
                - slug: educacao
                  name: Educação
                - slug: outros
                  name: Outros

  /expenses/{id}:
    get:
      tags: [Despesas]
      summary: Buscar gasto por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gasto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '404':
          description: Gasto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Despesas]
      summary: Deletar gasto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deletado com sucesso
        '404':
          description: Gasto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Investimentos ─────────────────────────────────────────────────────────

  /investments:
    post:
      tags: [Investimentos]
      summary: Registrar investimento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvestmentRequest'
      responses:
        '201':
          description: Investimento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentResponse'
        '400':
          description: Dados inválidos ou tipo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Investimentos]
      summary: Listar investimentos
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            example: 2026-03
          description: Filtrar por mês (YYYY-MM).
        - name: type
          in: query
          schema:
            type: string
            example: cdb
          description: Filtrar por slug do tipo.
      responses:
        '200':
          description: Lista de investimentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestmentResponse'

  /investments/types:
    get:
      tags: [Investimentos]
      summary: Listar tipos de investimento disponíveis
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tipos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestmentTypeItem'
              example:
                - slug: cdb
                  name: CDB
                - slug: cotas
                  name: Cotas
                - slug: acoes
                  name: Ações
                - slug: tesouro
                  name: Tesouro Direto
                - slug: cripto
                  name: Cripto
                - slug: poupanca
                  name: Poupança

  /investments/{id}:
    get:
      tags: [Investimentos]
      summary: Buscar investimento por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Investimento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentResponse'
        '404':
          description: Investimento não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Investimentos]
      summary: Deletar investimento
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deletado com sucesso
        '404':
          description: Investimento não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Receitas ──────────────────────────────────────────────────────────────

  /revenues:
    post:
      tags: [Receitas]
      summary: Registrar receita
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRevenueRequest'
      responses:
        '201':
          description: Receita registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Receitas]
      summary: Listar receitas
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            example: 2026-03
          description: Filtrar por mês (YYYY-MM).
      responses:
        '200':
          description: Lista de receitas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevenueResponse'

  # ─── Dashboard ─────────────────────────────────────────────────────────────

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Resumo financeiro mensal
      description: Retorna totais de gastos, receitas, saldo e investimentos do mês. Sem `month` usa o mês atual.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            example: 2026-03
          description: Mês de referência (YYYY-MM). Padrão mês atual.
      responses:
        '200':
          description: Resumo retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dashboard/statement:
    get:
      tags: [Dashboard]
      summary: Extrato de transações
      description: Retorna todas as movimentações do mês (gastos, receitas e investimentos) em ordem cronológica decrescente. Sem `month` usa o mês atual.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            example: 2026-03
          description: Mês de referência (YYYY-MM). Padrão mês atual.
      responses:
        '200':
          description: Extrato retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementResponse'
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
